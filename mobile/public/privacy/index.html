      * { box-sizing: border-box; }
      body {
        margin: 0;

      h1 {
        margin: 14px 0 4px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .updated {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .lang-switch {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 16px 0 0;
        direction: ltr;
      }
      .lang-switch button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
      }
      .lang-switch button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 26px 24px;
        margin-top: 20px;
      }
      .card p {
        margin: 0 0 14px;
        font-size: 14.5px;
        line-height: 1.8;
      }
      .card p:last-child { margin-bottom: 0; }
      .card h2 {
        font-size: 15.5px;
        margin: 22px 0 8px;
      }
      .card h2:first-child { margin-top: 0; }
      .card a { color: var(--accent); }
      .back {
        display: block;
        text-align: center;
        margin-top: 24px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;

      footer {
        margin-top: 28px;
        text-align: center;
        font-size: 11px;

              p: 'إذا غيّرنا طريقة جمع التطبيق للمعلومات أو استخدامه لها (مثل إضافة بيانات استخدام مجهولة الهوية مستقبلًا)، فسنقوم بتحديث هذا المستند والتاريخ المذكور أعلاه.',
            },
            {
              h: 'التواصل معنا',
              pHtml: function () {
                return 'يمكن إرسال الأسئلة المتعلقة بهذه السياسة إلى: <a href="mailto:' + CONTACT_EMAIL + '">' + CONTACT_EMAIL + '</a>';
              },
            },
          ],
          back: 'العودة إلى التطبيق',
          footer: 'هذه أداة مساعدة فقط ولا تضمن الدقة الكاملة — كن حذرًا دائمًا',
        },
      };

      function isSupported(code) {
        return LANGUAGES.some(function (l) { return l.code === code; });
      }

      function isRTL(code) {
        var lang = LANGUAGES.filter(function (l) { return l.code === code; })[0];
        return lang ? lang.rtl : false;
      }

      function getStoredLanguage() {
        try {
          var stored = window.localStorage.getItem(STORAGE_KEY);
          if (stored && isSupported(stored)) return stored;
        } catch (e) {}
        return null;
      }

      function getBrowserDefaultLanguage() {
        var locales = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]) || [];
        for (var i = 0; i < locales.length; i++) {
          var code = (locales[i] || '').slice(0, 2).toLowerCase();
          if (isSupported(code)) return code;
        }
        return DEFAULT_LANGUAGE;
      }

      function render(lang) {
        var s = STRINGS[lang];
        var rtl = isRTL(lang);

        document.documentElement.lang = lang;
        document.documentElement.dir = rtl ? 'rtl' : 'ltr';
        document.title = s.pageTitle;
        document.querySelector('meta[name="description"]').setAttribute('content', s.metaDescription);

        document.getElementById('pp-title').textContent = s.h1;
        document.getElementById('pp-updated').textContent = s.updatedLabel(UPDATED_DATE);
        document.getElementById('pp-back').textContent = s.back;
        document.getElementById('pp-footer').textContent = s.footer;

        var card = document.getElementById('pp-card');
        card.innerHTML = '';

        var intro = document.createElement('p');
        intro.textContent = s.intro;
        card.appendChild(intro);

        s.sections.forEach(function (section) {
          var h2 = document.createElement('h2');
          h2.textContent = section.h;
          card.appendChild(h2);

          var p = document.createElement('p');
          if (section.pHtml) {
            p.innerHTML = section.pHtml();
          } else {
            p.textContent = section.p;
          }
          card.appendChild(p);
        });

        var switchEl = document.getElementById('pp-lang-switch');
        switchEl.innerHTML = '';
        LANGUAGES.forEach(function (l) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('aria-pressed', String(l.code === lang));
          btn.setAttribute('lang', l.code);
          btn.textContent = l.flag + ' ' + l.name;
          btn.addEventListener('click', function () {
            try { window.localStorage.setItem(STORAGE_KEY, l.code); } catch (e) {}
            render(l.code);
          });
          switchEl.appendChild(btn);
        });
      }

      render(getStoredLanguage() || getBrowserDefaultLanguage());
    </script>
  </body>
</html>
